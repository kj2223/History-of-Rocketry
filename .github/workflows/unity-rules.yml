# THE UNITY PORT'S RULES: builds unity/AdAstra.Rules with dotnet and runs its tests (no Unity editor or licence needed).
# It also re-records the golden traces and the data export from the JS game and fails if they differ from what is
# checked in, so the C# port is always checked against the JS as it stands.
name: Unity rules

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Golden traces and data export match the JS game
        run: |
          node tools/golden/record.mjs
          node tools/export-data.mjs
          git diff --exit-code -- unity/
      - name: Rules tests
        run: dotnet test unity/AdAstra.sln
