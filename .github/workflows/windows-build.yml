# THE TEST BUILD: on every push to main, builds the Windows installer and portable .exe for playtesters
# and publishes them as a numbered release: v0.3.0, v0.3.1 and so on, one number per merge.
# The first two numbers come from "version" in package.json; change it to 0.4.0 to start the v0.4.x series.
# Pull requests into main build too, to check the build still works, but publish nothing.
# Development checks run separately on dev; promote playtested changes to main for release.
# The file names stay the same in every release, so these links always fetch the newest build:
#   https://github.com/kj2223/history-of-rocketry/releases/latest/download/ProjectVanguard-Setup.exe
#   https://github.com/kj2223/history-of-rocketry/releases/latest/download/ProjectVanguard-Portable.exe
# The builds are unsigned, so Windows SmartScreen warns on first run (More info, then Run anyway).
name: Windows test build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The next number in the series: one more than the highest vX.Y.N release so far, or vX.Y.0 for the first.
      # Only a push to main publishes: a manual run or a pull request builds and checks, nothing more.
      - name: Pick the release number
        id: release-version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SERIES=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          LAST=$(gh release list --limit 1000 --json tagName -q '.[].tagName' | { grep -E "^v${SERIES//./\\.}\.[0-9]+$" || true; } | sed "s/^v$SERIES\.//" | sort -n | tail -1)
          VERSION="$SERIES.$([ -z "$LAST" ] && echo 0 || echo $(( LAST + 1 )))"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: project-vanguard-windows
          if-no-files-found: error
          overwrite: true
          path: |
            dist/ProjectVanguard-Setup.exe
            dist/ProjectVanguard-Portable.exe

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project-vanguard-windows
          path: dist
      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          MAIN=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping release because this commit is no longer the head of main."
            exit 0
          fi
          gh release create "v$VERSION" dist/ProjectVanguard-Setup.exe dist/ProjectVanguard-Portable.exe \
            --target "$GITHUB_SHA" --title "Ad Astra v$VERSION" --generate-notes --latest
          # The rolling "dev-build" release from before numbered releases; the latest links replace it.
          gh release delete dev-build --yes --cleanup-tag || true
