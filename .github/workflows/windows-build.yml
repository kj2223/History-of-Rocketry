name: Windows release candidate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Run simulation and persistence tests
        run: python -m unittest discover -s tests -q
      - name: Test source application lifecycle
        run: python tools/smoke_windows.py
      - name: Install build tools
        run: |
          python -m pip install -r requirements-build.txt
          choco install innosetup --yes --no-progress
      - name: Build portable and installer
        run: python tools/build_windows.py
      - name: Test actual portable and installed builds
        run: python tools/smoke_windows.py --exe dist/PerAspera-Portable.exe --installer dist/PerAspera-Setup.exe
      - name: Record hashes and source revision
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content dist/SHA256SUMS.txt
          git rev-parse HEAD | Set-Content dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PerAspera-Windows-RC-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
