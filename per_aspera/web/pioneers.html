<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Per Aspera · Early rocketry</title><style>__WORKSPACE_STYLES__</style><style>
#pa-modern .p-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}#pa-modern .p-stats{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0}#pa-modern .p-stats strong{font-size:26px;display:block}#pa-modern .p-stats small,#pa-modern .p-note{color:var(--pm-muted)}#pa-modern .p-note{font-size:13px;line-height:1.6}#pa-modern .p-card{margin-bottom:18px}#pa-modern label{display:block;margin:14px 0}#pa-modern select,#pa-modern textarea,#pa-modern input{max-width:100%}#pa-modern textarea{width:100%;min-height:100px}#pa-modern .p-scroll{overflow:auto}#pa-modern .p-tag{font-size:12px;border:1px solid var(--pm-line);border-radius:20px;padding:4px 10px;display:inline-block}#pa-modern .p-camera{background:#132630;border-radius:12px;overflow:hidden;position:relative}#pa-modern canvas{width:100%;height:310px;display:block}#pa-modern .p-camera-caption{padding:12px 20px;color:#c8d5d9;font-size:12px}#pa-modern #transcript{height:350px;overflow:auto;overscroll-behavior:contain}#pa-modern #transcript article{padding:14px 0;border-bottom:1px solid var(--pm-line)}#pa-modern #transcript article p{margin:6px 0}#pa-modern #transcript article[data-kind=anomaly]{border-left:4px solid #bc673d;padding-left:14px;background:var(--pm-warm)}#pa-modern #met{font-variant-numeric:tabular-nums;font-family:monospace;font-size:30px}#pa-modern .p-actions{display:flex;gap:10px;flex-wrap:wrap}#pa-modern .pm-issue{padding:20px 28px;margin:15px 28px;background:var(--pm-warm);color:var(--pm-ink);border-left:4px solid #b97531}#pa-modern #feedback{padding:0 28px;color:light-dark(#a13e27,#ffb19b)}#pa-modern .p-links button{font-size:12px;margin:4px}#pa-modern #notice:empty{display:none}@media(max-width:950px){#pa-modern .p-grid{grid-template-columns:1fr}#pa-modern canvas{height:260px}}
#pa-modern .p-watch-status{display:flex;gap:25px;align-items:center;margin-bottom:18px}#pa-modern .p-watch-status h2,#pa-modern .p-watch-status p{margin:0}#pa-modern .p-observation-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}#pa-modern #camera{height:280px}#pa-modern #radar{height:280px}#pa-modern #magnification{display:inline-block;width:75px;margin-left:8px}#pa-modern .p-watch-status #met{min-width:225px;font-size:27px}#pa-modern .p-observation-grid #transcript{height:390px}@media(max-width:950px){#pa-modern .p-observation-grid{grid-template-columns:1fr}#pa-modern .p-watch-status{display:block}}
</style></head><body><div id="pa-modern"><div class="pm-shell"><aside class="pm-sidebar"><div class="pm-brand">PER ASPERA<span>Experimental programme</span></div><nav aria-label="Workspace"><button data-view="briefing">Briefing</button><button data-view="programme">Flight programme</button><button data-view="watch">Range observation</button><button data-view="people">Your team</button><button data-view="funding">Funding</button><button data-view="records">Evidence & records</button></nav><div class="pm-side-footer">White Sands<span>1945–1949 · standalone prototype</span></div></aside><div class="pm-workspace"><header class="pm-topbar"><span class="pm-context">From experiment to programme</span><div><span id="date"></span><span id="state"></span><button id="next" data-action="next">Next report / event</button><button id="run" data-action="run">Run</button><select id="speed" aria-label="Presentation speed"><option value="0.5">0.5×</option><option value="1">Auto</option><option value="4">4×</option><option value="16">16×</option></select></div></header><div id="notice" aria-live="polite"></div><div id="feedback" role="status"></div><main class="pm-main"></main><footer class="pm-bottom"><span>Programme leadership · range retains operational authority</span><button data-view="settings">Save & settings</button></footer></div></div></div>
<script src="/pioneers-observation.js"></script>
<script>
(()=>{
const TOKEN='__CAMPAIGN_TOKEN__',root=document.getElementById('pa-modern'),main=root.querySelector('main');
let previousObservation=null,observationReceived=0,observationMode='bunker';
let S=null,view='briefing',busy=false,notice='',sequence=-1,logIds=new Set(),selected=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString(),event=id=>S.events.find(e=>e.id===id),done=()=>S.status==='complete';
const button=(text,action,params='',disabled=false)=>`<button type="button" data-action="${action}" ${params} ${disabled?'disabled':''}>${text}</button>`;
const link=(text,target)=>`<button type="button" data-view="${target}">${text}</button>`;
const title=(name,detail)=>`<h1>${name}</h1><p class="pm-subtitle">${detail}</p>`;
const stats=()=>`<div class="p-stats">${[['Available',S.funds.available],['Committed',S.funds.committed],['Paid',S.funds.paid]].map(([k,n])=>`<div><strong>${money(n)}</strong><small>${k}</small></div>`).join('')}</div>`;
const links=e=>`<div class="p-links">${e.links.map(id=>`<button data-record="${id}">${esc(event(id)?.title||id)}</button>`).join('')}</div>`;
function chrome(){
 document.getElementById('date').textContent=S.date;document.getElementById('state').textContent=done()?'Chapter complete':S.running?'Running':'Paused';
 const run=document.getElementById('run');run.textContent=S.running?'Pause':'Run';run.dataset.action=S.running?'pause':'run';run.disabled=done()||!!S.attention.length;
 document.getElementById('next').disabled=done()||!!S.attention.length;
 if(document.activeElement.id!=='speed')document.getElementById('speed').value=S.speed;
 root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));
 const signature=S.attention.join();if(signature!==notice){notice=signature;const e=event(S.attention[0]);document.getElementById('notice').innerHTML=e?`<div class="pm-issue"><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p><p class="p-note">${e.kind==='anomaly'?'Observation pause · Vega handles range safety. This pause adds no in-world intervention time.':'Report for review · acknowledge to continue the funded remit.'}</p>${button('Acknowledge & continue','acknowledge')}${link('Inspect range record','watch')}${links(e)}</div>`:'';}
 document.getElementById('feedback').textContent=S.error||'';
}
function briefing(){
 const job=S.jobs.find(j=>j.kind==='prepare'),latest=S.flights.at(-1);
 return title(done()?'Programme review':'Your experimental programme','A small team, uncertain evidence, and the next question worth answering.')+`<section class="pm-panel"><span class="p-tag">${S.flight?'Flight in progress':S.vehicle?'Awaiting range release':job?'The team is preparing a round':done()?'Record preserved':'Choose a funded objective'}</span><h2>${S.flight?esc(S.flight.name):job?esc(S.profiles.find(p=>p.id===job.profile).name):'From a launch attempt to a useful result'}</h2><p>${job?'Preparation due '+esc(job.due_date)+'. Ellis selects detailed checks within your funded remit.':S.flight?'Your team is on the range. Watch the flight or continue reviewing the programme.':S.vehicle?'The prepared vehicle is ready. Review the range report and release the attempt.':'Start with a Tiny Tim trial. The objective is a usable record, not simply the highest flight.'}</p><div class="p-actions">${S.flight?link('Watch the flight','watch'):S.vehicle?button('Release to range','launch','',!!S.attention.length):link('Open flight programme','programme')}${link('Meet the team','people')}</div></section>${stats()}<div class="p-grid"><section class="pm-panel"><h2>What has been demonstrated?</h2><p>${S.flights.length} flight(s) recorded · ${S.flights.filter(f=>f.useful).length} support their scoped objective.</p>${latest?`<p>Latest: ${esc(S.profiles.find(p=>p.id===latest.profile).name)} · configuration ${latest.revision}.</p><p>${esc(event(latest.event).detail)}</p>`:'<p>No flight evidence yet. The inherited drawings are a starting point, not flight qualification.</p>'}${link('Read evidence','records')}</section><section class="pm-panel"><h2>The next boundary</h2><p>September 1945: booster and WAC trials. Improved research rounds become available in 1946, staging work in 1948, and powered Bumper attempts in 1949.</p><p>Dates open opportunities; your earlier flight evidence is still required. Parallel recruitment is possible, but this small team has one preparation/range stream.</p>${link('Review available objectives','programme')}</section></div>`;
}
function programme(){return title('Flight programme','Authorise objectives and funding. Ellis and the specialists choose preparation, instrumentation checks and range procedures.')+`<section class="pm-panel p-card">${stats()}${S.remit?`<h2>Current remit</h2><p>${esc(S.profiles.find(p=>p.id===S.remit.profile).name)} · ${S.remit.remaining} further rounds · ${money(S.remit.balance)} unused authority. ${S.remit.delegated?'Delegated execution; every flight report returns for acknowledgement.':'Direct range-release review.'}</p>${button('Release unused authority','release','',done()||S.remit.balance===0)}<p class="p-note">Contracted preparation continues. Releasing unused authority does not refund completed work.</p>`:'<p>No active remit. One flight at a time is often the best starting point; up to three rounds may share an objective.</p>'}${S.vehicle?button('Release prepared vehicle to range','launch','',!!S.attention.length):''}</section><div class="p-grid">${S.profiles.map(p=>`<section class="pm-panel"><span class="p-tag">${S.flights.some(f=>f.profile===p.id&&f.useful)?'Scoped evidence recorded':p.blocker?'Not yet available':'Available'}</span><h2>${esc(p.name)}</h2><p>${esc(p.question)}</p><p class="p-note">${esc(p.blocker||'No prerequisite outstanding. Earlier successful flights do not guarantee this result.')}</p><form data-form="authorise"><input type="hidden" name="profile" value="${p.id}"><label>Programme priority<select name="focus"><option value="balanced">Balanced preparation</option><option value="flight margins">Additional flight margins</option><option value="measurement">Stronger measurement coverage</option></select></label><label>Number of rounds<select name="count"><option>1</option><option>2</option><option>3</option></select></label><label><input type="checkbox" name="delegated" checked> Delegate range release after team checks</label><p class="quote" data-base="${p.cost}" data-days="${p.days}">${money(p.quote.cost)} · about ${p.quote.days} days per round</p><p class="p-note">Research allocation → reserved remit → contractor payment once on completion. Includes expendable hardware, preparation and aggregate labour. Failures consume their round.</p><button ${done()||p.blocker||S.remit||S.vehicle||S.flight||S.attention.length?'disabled':''}>Authorise funded remit</button></form></section>`).join('')}</div><section class="pm-panel"><h2>Longer research windows</h2><p>When your current work is finished, advance to the next sponsor/range opportunity. No capability or money is granted by the calendar.</p>${button('Next research opportunity','opportunity','',done())}${button('Close and review this chapter','close','',done()||!!S.flight)}<p class="p-note">Closing early preserves the record and outstanding obligations. It does not merge into the later prototypes.</p></section>`;}
function people(){return title('Your team','Fictional persistent colleagues in a simplified university/Army project. Recruitment retainer covers the chapter.')+`<div class="p-grid">${S.staff.map(p=>`<section class="pm-panel"><span class="p-tag">${p.appointed?'In post':p.pending?'Joining in 30 days':'Available to recruit'}</span><h2>${esc(p.name)}</h2><p>${esc(p.role)} · ${esc(p.expertise)}</p><p>“${esc(p.opinion)}”</p>${!p.appointed&&!p.pending?`<p>${money(p.salary)} · 30 days · research allocation</p>${button('Recruit engineer','recruit',`data-person="${p.id}"`,done()||p.salary>S.funds.available||!!S.attention.length)}`:''}</section>`).join('')}</div><p class="p-note">Chen strengthens future propulsion/structure preparation; Brooks strengthens measurement preparation and recovery; Reed strengthens future staging work. Appointments do not rewrite completed flights or guarantee success.</p>`;}
function funding(){return title('Funding','Finite illustrative sponsor authority. No annual automatic income, unrestricted transfers or historical price claims.')+stats()+`<section class="pm-panel"><h2>Sponsor continuation</h2><p>Initial authority: ${money(1200000)}. Current authorised total: ${money(S.funds.allocation)}.</p><p>A research continuation may be considered from 1946 after three flight records. A staging award may be considered from 1948 after useful improved-WAC evidence. Each proposal is considered once and can be refused.</p>${button('Submit current continuation proposal','proposal','',done()||!!S.attention.length)}<p class="p-note">Submitted: ${esc(S.grant_attempts.join(', ')||'none')}. Approved: ${esc(S.grants.join(', ')||'none')}. If funds run low, reduce round count, release unused authority or close with incomplete objectives. Already committed work continues.</p></section><div class="p-scroll"><table class="pm-table"><thead><tr><th>Date / programme</th><th>Transaction</th><th>Purpose</th><th>Amount</th><th>Available</th></tr></thead><tbody>${S.ledger.slice().reverse().map(e=>`<tr><td>${esc(e.date)}<br>${esc(e.programme)}</td><td>${esc(e.operation)}</td><td>${esc(e.purpose)}</td><td>${money(e.amount)}</td><td>${money(e.available)}</td></tr>`).join('')}</tbody></table></div>`;}
function records(){const e=event(selected);return title('Evidence & programme memory','Observations, staff judgement and your interpretation remain distinct.')+`<section class="pm-panel"><h2>Your working interpretation</h2><form data-form="theory"><label>What do you believe the evidence means?<textarea name="text" maxlength="2000">${esc(S.theory)}</textarea></label><button>Record interpretation</button></form><p class="p-note">A note records your judgement; it does not change the vehicle or measurements.</p></section>${e?`<section class="pm-panel"><h2>${esc(e.title)}</h2><p>${esc(e.date)} · ${esc(e.actor)}</p><p>${esc(e.detail)}</p>${links(e)}</section>`:''}<section class="pm-panel"><h2>Flight evidence</h2>${S.flights.map(f=>`<article class="pm-row"><h3>${esc(S.profiles.find(p=>p.id===f.profile).name)} · configuration ${f.revision}</h3><p>${esc(f.date)} · ${f.useful?'Scoped objective supported':'Objective unconfirmed'}</p><p>${esc(event(f.event).detail)}</p>${links(event(f.event))}</article>`).join('')||'<p>No flight records yet.</p>'}</section><h2>Event archive</h2>${S.events.slice().reverse().map(e=>`<article class="pm-panel p-card"><small>${esc(e.date)} · ${esc(e.actor)}</small><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p>${links(e)}</article>`).join('')}`;}
function watch(){return title('White Sands · bunker & tracking','Watch the departure from shelter, then follow the ground stations. Range personnel retain operational authority.')+`<section class="pm-panel p-watch-status"><div id="met"></div><div><h2 id="phase"></h2><p id="watch-detail"></p></div></section><div class="p-grid p-observation-grid"><section><div class="p-actions" style="margin-bottom:12px"><button data-observer="bunker">Bunker window</button><button data-observer="radar">Radar station</button></div><div id="bunker-panel" class="p-camera" ${observationMode!=='bunker'?'hidden':''}><canvas id="camera" aria-label="Launch bunker sightline"></canvas><div class="p-camera-caption"><label style="display:inline">View magnification <select id="magnification" aria-label="Bunker view magnification"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></label> · fixed observation slit</div></div><div id="radar-panel" class="p-camera" ${observationMode!=='radar'?'hidden':''}><canvas id="radar" aria-label="Radar range and elevation plotting board"></canvas><div id="radar-readout" class="p-camera-caption"></div></div><details class="p-note"><summary>Observation limits</summary><p>The bunker uses a projected sightline into the simulated flight. A rocket can leave its field of view. Radar fixes have limited coverage and measurement error; no return means no plotted position. This is a reconstructed observation experience, not an exact instrument replica. The flat-earth point-mass model omits drag and detailed aerodynamics.</p></details></section><section><section class="pm-panel"><h2>Range transcript</h2><div id="transcript" tabindex="0" aria-label="Persistent range transcript"></div><p id="new-log" class="p-note" aria-live="polite"></p><button id="latest-log">Jump to latest</button></section><section class="pm-panel"><h3>Ask the project engineer</h3><select id="question" aria-label="Briefing question"><option value="observations">What do we actually know?</option><option value="causes">What remains uncertain?</option><option value="recommendation">What do you recommend?</option></select><button id="ask">Request briefing</button><p id="reply" aria-live="polite"></p></section></section></div>`;}
function settings(){return title('Save & settings','The 1945 prototype has its own saves. Existing Apollo and NASA-formation files are unchanged.')+`<section class="pm-panel"><p>${esc(S.save_name)} · seed ${S.seed}</p>${button('Save now','save')}${button('Save and close server','shutdown')}<form data-form="fresh"><label>Fresh campaign seed<input name="seed" type="number" min="0" max="4294967295" value="${S.seed}" required></label><button>Restart in a separate fresh save</button></form><form data-form="load"><label>Resume a 1945 save<select name="name">${S.saves.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><button>Load selected save</button></form><p><a href="/api/export" target="_blank">Export public programme record</a></p></section>`;}
function render(){chrome();main.innerHTML=({briefing,programme,people,funding,records,watch,settings}[view]||briefing)();sequence=S.events.length;logIds=new Set();if(view==='watch')updateWatch();}
function updateWatch(){
 const f=S.flight,latest=S.flights.at(-1);document.getElementById('met').textContent=f?'T+'+new Date(f.elapsed*1000).toISOString().slice(11,19):'Range stand-by';
 document.getElementById('phase').textContent=f?f.phase:S.vehicle?'Prepared vehicle awaiting release':latest?'Flight report recorded':'Awaiting a funded flight';
 document.getElementById('watch-detail').textContent=f?f.name+' · configuration '+f.revision+' · '+(f.anomaly?'Unexpected development under range management.':'Observers monitoring the authorised attempt.'):latest?event(latest.event).detail:'Authorise a flight remit in Flight programme. Preparation leads to range review or delegated launch.';
 const box=document.getElementById('transcript'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<35;let added=0;
 for(const e of S.events){if(logIds.has(e.id))continue;logIds.add(e.id);if(!['launch','transcript','anomaly','review','report','work','decision','personnel','briefing'].includes(e.kind))continue;const a=document.createElement('article');a.dataset.kind=e.kind;a.innerHTML=`<small>${esc(e.date)} · ${esc(e.actor)}</small><strong style="display:block">${esc(e.title)}</strong><p>${esc(e.detail)}</p>`;box.append(a);added++;}
 if(atBottom)box.scrollTop=box.scrollHeight;document.getElementById('new-log').textContent=!atBottom&&added?'New entries below; your reading position is preserved.':'';
 drawCamera();
}
function drawCamera(){
 const camera=document.getElementById('camera'),radar=document.getElementById('radar');if(!camera||!radar||!S)return;
 const f=S.flight,latest=S.flights.at(-1),tracking=f?.tracking,old=previousObservation;
 let optical=tracking?.optical?{...tracking.optical}:null,elapsed=f?.elapsed||0;
 if(S.running&&f&&old&&old.revision===f.revision&&old.name===f.name&&old.elapsed<=f.elapsed){
  const mix=Math.min(1,(performance.now()-observationReceived)/200);elapsed=old.elapsed+(f.elapsed-old.elapsed)*mix;
  if(optical?.visible&&old.tracking?.optical.visible)optical.elevation_deg=old.tracking.optical.elevation_deg+(optical.elevation_deg-old.tracking.optical.elevation_deg)*mix;
 }
 if(f)document.getElementById('met').textContent='T+'+new Date(elapsed*1000).toISOString().slice(11,23);
 const kind=f?.vehicle||(S.vehicle?.profile.startsWith('bumper')?'bumper':S.vehicle?.profile==='booster'?'booster':S.vehicle?'wac':null);
 if(camera.clientWidth)PioneerObservation.bunker(camera,optical,kind,elapsed,Number(document.getElementById('magnification').value));
 const record=tracking?.radar||(!S.vehicle?latest?.tracking:null);if(radar.clientWidth)PioneerObservation.radar(radar,record,elapsed);
 const fix=record?.last_fix;
 document.getElementById('radar-readout').textContent=record?(record.status+(fix?' · '+fix.range_km.toFixed(2)+' km slant range · '+fix.elevation_deg.toFixed(1)+'° elevation · derived height '+fix.height_km.toFixed(2)+' km · fix T+'+fix.elapsed+' s':'')+(f?'':' · archived record')):'Range station awaiting a flight. No measured track available.';
}
function observationFrame(){if(view==='watch'&&S?.running)drawCamera();requestAnimationFrame(observationFrame)}
requestAnimationFrame(observationFrame);
async function api(action,params={},paint=true){if(busy)return;busy=true;try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','X-Per-Aspera':TOKEN},body:JSON.stringify({action,...params})}),data=await r.json();if(data.campaign){previousObservation=S?.flight;S=data;observationReceived=performance.now()}if(data.stopped){document.getElementById('feedback').textContent='Saved. Server closed.';return}chrome();if(!r.ok)return;if(paint)render();else if(view==='watch')updateWatch();else if(sequence!==S.events.length&&!main.contains(document.activeElement)){const top=scrollY;render();scrollTo(0,top)}}catch(e){document.getElementById('feedback').textContent='Connection interrupted: '+e.message}finally{busy=false}}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!S)return;if(b.dataset.observer){observationMode=b.dataset.observer;document.getElementById('bunker-panel').hidden=observationMode!=='bunker';document.getElementById('radar-panel').hidden=observationMode!=='radar';root.querySelectorAll('[data-observer]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.observer===observationMode)));drawCamera();return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.record){selected=b.dataset.record;view='records';render();return}if(b.id==='latest-log'){const box=document.getElementById('transcript');box.scrollTop=box.scrollHeight;return}if(b.id==='ask'){await api('brief',{question:document.getElementById('question').value},false);document.getElementById('reply').textContent=S.events.filter(e=>e.kind==='briefing').at(-1)?.detail||'';return}if(b.dataset.action){if(b.dataset.action==='close'&&!confirm('Close this chapter and preserve its record?'))return;await api(b.dataset.action,b.dataset.person?{person:b.dataset.person}:{},view!=='watch'&&!['run','pause','speed'].includes(b.dataset.action))}});
root.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const p=Object.fromEntries(new FormData(f));if(f.dataset.form==='authorise'){p.count=Number(p.count);p.delegated=!!p.delegated}if(f.dataset.form==='fresh'){if(!confirm('Preserve this save and start a separate 1945 campaign?'))return;p.seed=Number(p.seed);view='briefing'}if(f.dataset.form==='load')view='briefing';await api(f.dataset.form,p)});
root.addEventListener('change',e=>{if(e.target.id==='magnification'){drawCamera();return}if(e.target.id==='speed'){api('speed',{value:Number(e.target.value)},false);return}const f=e.target.closest('form[data-form=authorise]');if(f){const q=f.querySelector('.quote'),priority=f.elements.focus.value,n=Number(f.elements.count.value),extra=priority==='balanced'?12000:24000,days=Number(q.dataset.days)+(priority==='balanced'?5:priority==='measurement'?10:12);q.textContent=money((Number(q.dataset.base)+extra)*n)+' total · about '+days+' days per round · Army-sponsored research allocation'}});
window.addEventListener('resize',drawCamera);
async function poll(){if(S?.running)await api('tick',{},false);setTimeout(poll,200)}
fetch('/api/state').then(r=>r.json()).then(s=>{S=s;render();poll()}).catch(e=>main.textContent=e.message);
})();
</script></body></html>
