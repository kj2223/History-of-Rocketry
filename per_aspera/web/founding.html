<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Per Aspera · NASA formation</title><style>__WORKSPACE_STYLES__</style>
<style>
#pa-modern #candidate-list{scroll-margin-top:90px}#pa-modern .f-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}#pa-modern .f-stack{display:grid;gap:18px}#pa-modern .f-note{color:var(--pm-muted);font-size:13px}#pa-modern .f-progress{height:5px;background:var(--pm-line);border-radius:4px;margin:18px 0}#pa-modern .f-progress span{display:block;height:100%;background:var(--pm-accent)}#pa-modern .f-status{display:inline-block;padding:4px 9px;border-radius:5px;background:var(--pm-soft);color:var(--pm-accent);font-size:12px}#pa-modern .f-roles{overflow:auto}#pa-modern .f-role-current{border-color:var(--pm-accent)}#pa-modern .f-evidence{border-left:3px solid var(--pm-accent);padding-left:16px;margin-top:18px}#pa-modern .f-cap{font-size:26px;font-weight:600}#pa-modern .f-budget{display:flex;flex-wrap:wrap;gap:22px}#pa-modern .f-budget small{display:block;color:var(--pm-muted)}#pa-modern .f-inline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}#pa-modern .f-inline label{flex:1;min-width:180px}#pa-modern .f-inline input{width:100%}#pa-modern a{color:var(--pm-accent)}#pa-modern #notice:empty,#pa-modern #feedback:empty{display:none}@media(max-width:850px){#pa-modern #candidate-list{scroll-margin-top:90px}#pa-modern .f-grid{grid-template-columns:1fr}}
</style></head><body><div id="pa-modern" aria-label="NASA formation workspace"><div class="pm-shell">
<aside class="pm-sidebar"><div class="pm-brand">PER ASPERA<span>NASA Administrator</span></div><nav aria-label="Workspace">
<button data-view="briefing">Daily briefing</button><button data-view="people">People & organisation</button><button data-view="research">Research priorities</button><button data-view="authority">Delegated authority</button><button data-view="funding">Funding</button><button data-view="records">Records</button><button data-view="handoff">1961 review</button>
</nav><div class="pm-side-footer">NASA formation<span>1958 → 1961 · separate prototype</span></div></aside>
<div class="pm-workspace"><header class="pm-topbar"><span class="pm-context">Building the agency</span><div><span class="pm-date"></span><span class="pm-paused">Paused</span><button data-action="next">Next report</button><button id="run-button" data-action="run">Run</button><select id="speed" aria-label="Time compression"><option value="0.5">0.5×</option><option value="1">Auto</option><option value="4">4×</option><option value="16">16×</option></select></div></header>
<div class="pm-concept">Independent opening chapter · <span id="save-name"></span></div><div id="notice" role="region" aria-label="Matter requiring attention"></div><div id="feedback" role="status"></div><main class="pm-main" aria-label="Workspace content"></main><footer class="pm-bottom"><span>Institution, people and evidence · Apollo campaign remains separate</span><button data-view="settings">Save & settings</button></footer>
</div></div></div>
<script>
(() => {
 const TOKEN='__CAMPAIGN_TOKEN__',root=document.getElementById('pa-modern'),main=root.querySelector('main');
 let S=null,view='briefing',role='programme',domain='spacecraft',busy=false,sequence=0,attention='',record=null;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>'$'+(n/1e6).toLocaleString(undefined,{maximumFractionDigits:2})+'m';
 const candidate=id=>S.candidates.find(p=>p.id===id),programme=id=>S.research.find(p=>p.id===id),event=id=>S.events.find(e=>e.id===id);
 const person=id=>candidate(id)?.name||'Inherited acting cover';
 const title=(name,detail)=>`<h1>${esc(name)}</h1><p class="pm-subtitle">${esc(detail)}</p>`;
 const button=(text,action,extra='',disabled=false)=>`<button type="button" data-action="${action}" ${extra} ${disabled?'disabled':''}>${text}</button>`;
 const link=(text,target,extra='')=>`<button type="button" data-view="${target}" ${extra}>${text}</button>`;
 const status=p=>`<span class="f-status">${esc(p.status.replaceAll('_',' '))}</span>`;
 const done=()=>S.status==='complete';
 function chrome(){
   root.dataset.screen='founding';root.querySelectorAll('nav button').forEach(b=>{if(b.dataset.view===(view==='dossier'?'research':view))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
   root.querySelector('.pm-date').textContent=S.date;root.querySelector('.pm-paused').textContent=done()?'Chapter complete':S.running?'Running':'Paused';document.getElementById('save-name').textContent=S.save_name;
   const run=document.getElementById('run-button');run.textContent=S.running?'Pause':'Run';run.dataset.action=S.running?'pause':'run';run.disabled=done()||S.attention.length>0;
   root.querySelector('[data-action=next]').disabled=done()||S.attention.length>0;
   if(document.activeElement?.id!=='speed')document.getElementById('speed').value=String(S.speed);
   const signature=S.attention.join();if(signature!==attention){attention=signature;const e=event(S.attention[0]);document.getElementById('notice').innerHTML=e?`<div class="pm-issue"><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p>${button('Acknowledge report','acknowledge')}${e.domain?link('Open research file','dossier',`data-domain="${e.domain}"`):''}</div>`:'';}
   document.getElementById('feedback').textContent=S.error||'';
 }
 function briefing(){
   const vacant=Object.entries(S.appointments).find(([r,id])=>!id);const awaiting=S.research.find(p=>['awaiting continuation','adverse finding','resource hold'].includes(p.status));
   let heading='Choose the agency’s first research priorities.',detail='Inherited NACA teams can begin under acting cover. Appoint leaders and define reporting boundaries as the institution takes shape.',action=link('Review research proposals','research');
   if(vacant&&!S.appointments.programme){heading='Build your leadership team.';detail='NASA inherits laboratories and an experienced aggregate workforce. The new programme director and specialist posts need deliberate appointments.';action=link('Review programme-director candidates','people');}
   if(awaiting){heading=awaiting.name+' needs attention.';detail=awaiting.status==='resource hold'?'The proposed next package exceeds its remaining authority. Review the budget or defer the programme.':'A team report is available. Compare its observation with the named assessment, then continue work or revise delegation.';action=link('Read the research file','dossier',`data-domain="${awaiting.id}"`);}
   if(done()){heading='The lunar commitment has arrived.';detail='Review what the organisation can actually claim, what remains uncertain and what work is still committed. The Apollo campaign has not been changed.';action=link('Open the 1961 institution review','handoff');}
   return title('Good morning, Administrator.','A new agency, inherited knowledge and decisions about who should carry the work forward.')+`<div class="pm-split"><section class="pm-panel pm-priority"><span class="pm-label">${done()?'Institution review':'For your attention'}</span><h2>${esc(heading)}</h2><p>${esc(detail)}</p><div class="pm-actions">${action}${link('People & responsibilities','people')}</div><p class="f-note">Six senior posts · ${Object.values(S.appointments).filter(Boolean).length} appointed · ${S.teams} aggregate research teams. No individual workforce simulation.</p></section><aside class="pm-side-context"><h3>Work in progress</h3>${S.jobs.length?S.jobs.map(j=>`<div class="pm-row"><strong>${j.domain?esc(programme(j.domain).name):j.person?esc(person(j.person)):'Research capacity'}</strong><p>${esc(j.kind==='research'?event(j.id)?.title:j.kind)} · ${j.days_left} days remaining</p><span class="pm-small">${money(j.cost)} contracted · ${esc(j.account)}</span></div>`).join(''):'<p>No packages are running. Time still passes; it does not create research results or appoint staff.</p>'}</aside></div><section class="pm-later"><h3>Latest reports</h3>${S.events.filter(e=>['report','appointment','recruitment','context','capability'].includes(e.kind)).slice(-3).reverse().map(e=>`<div class="pm-row"><span class="pm-small">${esc(e.date)} · ${esc(e.actor)}</span><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p><button data-record="${e.id}" class="pm-quiet">Read the record →</button></div>`).join('')}</section>`;
 }
 function people(){
   const choices=S.candidates.filter(p=>p.role===role);
   return title('People & organisation','Appoint a persistent senior cast. The laboratories and wider workforce remain aggregate institutions.')+`<section class="pm-panel"><h2>Senior responsibilities</h2><div class="f-roles"><table class="pm-table"><thead><tr><th>Post</th><th>Current responsibility</th><th></th></tr></thead><tbody>${Object.entries(S.roles).map(([r,name])=>`<tr><td>${esc(name)}</td><td>${S.appointments[r]?esc(person(S.appointments[r])):'Vacant · inherited acting cover'}</td><td><button data-role="${r}">Candidates</button></td></tr>`).join('')}</tbody></table></div><p class="f-note">Acting NACA liaison Evelyn Price can coordinate directly supervised research. Delegation needs a programme director and the relevant specialist. Independent review is available from an inherited panel until an assurance lead is appointed.</p></section><section class="pm-later" id="candidate-list"><h2>${esc(S.roles[role])} · candidates</h2><div class="f-grid">${choices.map(p=>{const pending=S.jobs.find(j=>j.person===p.id||j.role===p.role&&j.kind==='appoint');return `<article class="pm-panel"><h2>${esc(p.name)}</h2><p>${esc(p.profile)}</p><div class="f-evidence"><strong>Candidate’s stated position</strong><p>${esc(p.view)}</p></div>${p.assessment?`<div class="f-evidence"><strong>Reference report · professional assessment</strong><p>${esc(p.assessment.text)}</p></div>`:'<p class="f-note">References have not been commissioned. A CV and stated opinion are not verified future performance.</p>'}${pending?`<p class="f-status">${esc(pending.kind)} · ${pending.days_left} days remaining</p>`:''}<div class="pm-actions">${button('References · $0.25m / 21 days','assess',`data-person="${p.id}"`,done()||!!p.assessment||!!pending)}${button(p.appointed?'In post':'Appoint · $1.5m / 30 days','appoint',`data-person="${p.id}"`,done()||p.appointed||!!pending)}</div><p class="f-note">The appointment cost covers mobilisation of an aggregate team for this chapter, not an individual salary. Two staffing packages can run together. Current contracts retain their original lead.</p>${p.memories.length?`<details><summary>Work and appointment record</summary>${p.memories.slice(-6).map(id=>`<p><button class="pm-quiet" data-record="${id}">${esc(event(id)?.title||id)}</button></p>`).join('')}</details>`:''}</article>`}).join('')}</div></section><section class="pm-panel pm-later"><h3>Aggregate research capacity</h3><p>${S.teams} teams available. Specialists and the independent reviewer still have individual availability limits.</p>${button('Fund third team · $8m / 90 days','expand','',done()||S.teams===3||S.jobs.some(j=>j.kind==='expand'))}</section>`;
 }
 function research(){return title('Research priorities','Choose the questions and account limits. The team proposes the technical packages.')+`<div class="f-grid">${S.research.map(p=>`<article class="pm-panel"><div class="pm-row-head"><h2>${esc(p.name)}</h2>${status(p)}</div><p>${esc(p.question)}</p><p>${esc(p.lead)} · ${esc(p.mode)} oversight</p><div class="f-progress"><span style="width:${p.stage/p.stages.length*100}%"></span></div><p class="f-note">${p.stage} / ${p.stages.length} research stages reported; independent review is a separate claim.</p><p>${p.authority?money(p.budget.available)+' available within programme / '+money(p.budget.contracted)+' contracted':money(p.quote.cost)+' proposed authority, including review and '+money(p.quote.contingency)+' corrective/review allowance'}</p>${link('Open proposal and evidence','dossier',`data-domain="${p.id}"`)}</article>`).join('')}</div>`;}
 function authorityControls(p){return `<h3>Reporting boundary</h3><p class="f-note">${p.can_delegate?'A programme director and specialist are in post. You can grant explicit bounded authority.':esc(p.delegation_reason)}</p><div class="pm-actions">${[['direct','Report at each stage'],['bounded','Delegate within allowance'],['refer','Delegate; refer adverse findings']].map(([mode,name])=>button(name,'delegate',`data-domain="${p.id}" data-mode="${mode}"`,done()||!p.authority||p.status==='demonstrated'||p.mode===mode||mode!=='direct'&&!p.can_delegate)).join('')}</div><p class="f-note">Delegation changes who may commission the next scoped package. It does not create capability, money or extra emergency intervention time.</p>`;}
 function dossier(){
   const p=programme(domain);
   return link('← Research priorities','research')+title(p.name,p.question)+`<div class="pm-split"><section class="pm-panel"><div class="pm-row-head"><h2>Research remit</h2>${status(p)}</div><p>Responsible specialist: ${esc(p.lead)}. ${esc(p.mode)} oversight.</p>${!p.authority?`<p>The team proposes ${money(p.quote.cost)} of research authority: scoped work, independent review and ${money(p.quote.contingency)} contingency for one corrective trial and review. Nominal serial work is about ${p.quote.days} days before queue, staffing or investigation delays.</p><form data-form="charter"><input type="hidden" name="domain" value="${p.id}"><label>Research allowance · $ millions<input name="millions" type="number" min="0.01" step="0.01" required value="${p.quote.cost/1e6}"></label><button ${done()?'disabled':''}>Authorise research remit</button></form>`:`<div class="f-budget">${Object.entries(p.budget).map(([k,v])=>`<div><span class="f-cap">${money(v)}</span><small>${esc(k)}</small></div>`).join('')}</div><p>${p.job?'Contracted package due '+esc(p.job.due_date)+'. Its price is already reserved.':'No package is currently contracted for this programme.'}</p>${authorityControls(p)}<div class="pm-actions">${button('Approve scoped continuation','continue',`data-domain="${p.id}"`,done()||!['awaiting continuation','adverse finding','deferred'].includes(p.status)||S.attention.length>0)}${button('Defer and release unassigned funds','defer',`data-domain="${p.id}"`,done()||p.status==='demonstrated'||p.status==='deferred')}</div><details class="pm-later"><summary>Explicit budget extension</summary><p>Only uncommitted research funds can extend the remit. Existing payments and evidence remain.</p><form data-form="topup"><input type="hidden" name="domain" value="${p.id}"><label>Additional authority · $ millions<input name="millions" type="number" min="0.01" step="0.01" value="10" required></label><button ${done()||p.status==='demonstrated'?'disabled':''}>Approve additional authority</button></form></details>`}<h3 class="pm-later">What the team plans to investigate</h3>${p.stages.map((stage,i)=>`<div class="pm-row"><strong>${esc(stage.name)}</strong><p>${money(stage.cost)} · ${stage.days} nominal days · ${i<p.stage?'report recorded':'planned scope'}</p></div>`).join('')}<p>Independent review: ${money(p.quote.review_cost)} / ${p.quote.review_days} nominal days. An appointed assurance lead changes the review arrangement; the inherited panel remains available.</p><p class="f-note">${esc(p.caveat)}</p></section><aside class="pm-side-context"><h3>Observed evidence and staff judgement</h3>${p.reports.length?p.reports.slice().reverse().map(r=>`<article class="f-evidence"><span class="pm-small">${esc(r.date)} · ${esc(r.source)} · revision ${r.revision}</span><h3>${esc(r.kind)} report</h3><p><strong>Observation:</strong> instrument/model agreement index ${r.observation.toFixed(3)}. Synthetic research observation; not flight reliability.</p><p><strong>Staff interpretation:</strong> ${esc(r.assessment)}</p><p class="f-note">${esc(r.caveat)}</p><button class="pm-quiet" data-record="${r.event}">Open source record →</button></article>`).join(''):'<p>No research observations are recorded yet. An appointment or funded plan alone does not establish a result.</p>'}</aside></div>`;
 }
 function authority(){return title('Delegated authority','Authority follows appointed responsibility, scoped funding and explicit reporting rules—not the date.')+`<div class="f-stack">${S.research.map(p=>`<section class="pm-panel"><h2>${esc(p.name)}</h2><p>${esc(p.lead)} · ${status(p)}</p>${authorityControls(p)}${link('Read scope and evidence','dossier',`data-domain="${p.id}"`)}</section>`).join('')}</div>`;}
 function funding(){return title('Funding and commitments','Illustrative finite no-year authority for the prototype; these are not historical NASA appropriations.')+`<div class="f-grid">${Object.entries(S.funds).map(([a,f])=>`<section class="pm-panel"><h2>${esc(a)}</h2><div class="f-cap">${money(f.available)}</div><p>Available · ${money(f.allocation)} allocated</p><p>${money(f.committed)} reserved/contracted · ${money(f.paid)} paid</p></section>`).join('')}</div><section class="pm-panel pm-later"><h3>Administrator reserve</h3><form class="f-inline" data-form="reserve"><label>Destination<select name="account"><option value="research">Research</option><option value="organisation">Organisation</option></select></label><label>Amount · $ millions<input name="millions" type="number" min="0.01" step="0.01" required></label><label>Reason<input name="reason" required maxlength="500"></label><button ${done()?'disabled':''}>Release existing reserve</button></form><p class="f-note">No annual top-ups or unrestricted account transfers. Research packages include aggregate labour. Appointments include team mobilisation; there is no separate individual payroll charge. Already funded work remains contracted when the reserve is empty.</p></section><section class="pm-later"><h3>Transaction ledger</h3><div class="f-roles"><table class="pm-table"><thead><tr><th>Date</th><th>Account / action</th><th>Purpose</th><th>Amount</th><th>Available</th></tr></thead><tbody>${S.ledger.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.account)} / ${esc(e.operation)}</td><td>${esc(e.purpose)}</td><td>${money(e.amount)}</td><td>${money(e.available)}</td></tr>`).join('')}</tbody></table></div><p class="f-note">Assignment draws on an already reserved allowance; settlement pays that obligation once. Release returns only unassigned authority.</p></section>`;}
 function records(){const selected=event(record);return title('Institutional record','Appointments, research, reporting boundaries and evidence retain their actual sources.')+`<section class="pm-panel"><h3>Your working interpretation</h3><form data-form="theory"><label>Administrator’s interpretation<textarea name="text" maxlength="2000" required>${esc(S.theory)}</textarea></label><button>Record interpretation</button></form><p class="f-note">Your interpretation does not change the observations or the underlying simulation.</p></section>${selected?`<section class="pm-panel pm-later"><h2>${esc(selected.title)}</h2><p>${esc(selected.date)} · ${esc(selected.actor)}</p><p>${esc(selected.detail)}</p><p>${selected.links.map(id=>`<button class="pm-quiet" data-record="${id}">${esc(event(id)?.title||id)}</button>`).join(' ')}</p></section>`:''}<section class="pm-later"><h3>Chronological archive</h3>${S.events.slice().reverse().map(e=>`<div class="pm-row"><span class="pm-small">${esc(e.date)} · ${esc(e.actor)}</span><h3><button class="pm-quiet" data-record="${e.id}">${esc(e.title)}</button></h3><p>${esc(e.detail)}</p></div>`).join('')}</section>`;}
 function handoff(){return title('The institution at the lunar commitment',done()?'25 May 1961: the opening chapter is complete.':'A live review of your institution; the chapter ends on 25 May 1961.')+`<section class="pm-panel"><h2>${done()?'What have you built?':'What can this agency currently claim?'}</h2><p>This review separates appointed responsibilities, demonstrated research evidence and unfinished work. It does not award Apollo hardware, transfer money or launch the later campaign.</p><div class="f-grid"><section><h3>People and responsibility</h3>${Object.entries(S.roles).map(([r,name])=>`<p><strong>${esc(name)}:</strong> ${S.appointments[r]?esc(person(S.appointments[r])):'Inherited acting cover'}</p>`).join('')}</section><section><h3>Research evidence</h3>${S.research.map(p=>`<div class="pm-row"><strong>${esc(p.name)}</strong><p>${status(p)} · ${p.reports.length} reports · ${esc(p.mode)} oversight</p>${link('Inspect evidence','dossier',`data-domain="${p.id}"`)}</div>`).join('')}</section></div><h3>Outstanding obligations</h3><p>${S.jobs.length} packages remain contracted. ${money(S.funds.research.committed)} research and ${money(S.funds.organisation.committed)} organisation authority remains committed. Work due after the boundary is preserved, not instantly completed or written off.</p><p><a href="/api/handoff" target="_blank" rel="noopener">Open the public handoff record (JSON)</a> · <a href="/api/export" target="_blank" rel="noopener">Open the public chapter archive</a></p><p class="f-note">The handoff contract is versioned. There is no Apollo importer yet. A future merge must also read the validated private opening save to preserve underlying reality; staff confidence cannot become physical truth by export.</p></section>`;}
 function settings(){return title('Opening-chapter saves','NASA-formation saves, pointers and server metadata are separate from the Apollo scenario.')+`<section class="pm-panel"><h3>Current opening</h3><p>${esc(S.save_name)} · seed ${S.seed} · ${esc(S.version_label)}</p><div class="pm-actions">${button('Save now','save')}${button('Save and quit','shutdown')}</div><section class="pm-later"><h3>Start a separate fresh opening</h3><form data-form="fresh"><label>Seed<input name="seed" type="number" min="0" max="4294967295" required value="${S.seed}"></label><button>Save this run and start fresh</button></form></section><section class="pm-later"><h3>Resume an opening</h3><form data-form="load"><label>1958 saves<select name="name">${S.saves.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><button>Resume selected opening</button></form></section><p class="f-note">No merge or save conversion into Apollo is performed. Source launch: python -m per_aspera --founding.</p></section>`;}
 function render(){if(!S)return;chrome();main.innerHTML=({briefing,people,research,dossier,authority,funding,records,handoff,settings}[view]||briefing)();sequence=S.events.length;}
 async function api(action,params={},paint=true){
   if(busy)return false;busy=true;
   try{const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','X-Per-Aspera':TOKEN},body:JSON.stringify({action,...params})});const data=await response.json();if(data.campaign)S=data;
     if(data.stopped){chrome();document.getElementById('feedback').textContent='Opening saved. The local chapter server has closed; the Apollo game remains separate.';return true}
     if(!response.ok){chrome();document.getElementById('feedback').textContent=data.error||'The command could not be completed.';return false}
     if(paint)render();else{chrome();if(S.events.length!==sequence&&['briefing','research','dossier','authority','handoff'].includes(view)&&!main.contains(document.activeElement)){const top=window.scrollY;render();window.scrollTo(0,top)}}return true;
   }catch(error){document.getElementById('feedback').textContent='Local connection interrupted. The last acknowledged save remains on disk. '+error.message;return false}finally{busy=false}
 }
 root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!S)return;
   if(b.dataset.view){view=b.dataset.view;if(b.dataset.domain)domain=b.dataset.domain;render();return}
   if(b.dataset.role){role=b.dataset.role;view='people';render();document.getElementById('candidate-list')?.scrollIntoView({block:'start'});return}
   if(b.dataset.record){record=b.dataset.record;view='records';render();return}
   if(b.dataset.action){const params={};for(const key of ['person','domain','mode'])if(b.dataset[key])params[key]=b.dataset[key];await api(b.dataset.action,params,!['run','pause'].includes(b.dataset.action))}
 });
 root.addEventListener('submit',async e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const fields=Object.fromEntries(new FormData(form));let action=form.dataset.form,params={...fields};
   if(['charter','topup','reserve'].includes(action)){params.amount=Math.round(Number(fields.millions)*1e6);delete params.millions}
   if(action==='fresh'){if(!confirm('Save this opening and create a separate fresh 1958 save?'))return;params.seed=Number(fields.seed);view='briefing'}
   if(action==='load')view='briefing';await api(action,params);
 });
 root.addEventListener('change',async e=>{if(e.target.id==='speed')await api('speed',{value:Number(e.target.value)},false)});
 async function poll(){if(S?.running)await api('tick',{},false);setTimeout(poll,250)}
 fetch('/api/state').then(r=>r.json()).then(data=>{S=data;render();poll()}).catch(error=>main.textContent='Unable to open this chapter: '+error.message);
})();
</script></body></html>
