<html><head><meta name="color-scheme" content="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Per Aspera · Lunar programme</title></head><body><div id="pa-modern" aria-label="Administrator workspace">

    </div>
  </div>
</div>
<style>
#pa-modern{color-scheme:light dark;--pm-bg:light-dark(#f4f7fa,#101820);--pm-surface:light-dark(#ffffff,#19242e);--pm-ink:light-dark(#1c2d3e,#e9f0f5);--pm-muted:light-dark(#5a6b7c,#adbdca);--pm-line:light-dark(#dce4eb,#344451);--pm-accent:light-dark(#205fc3,#9abfff);--pm-accent-ink:light-dark(#ffffff,#12233d);--pm-soft:light-dark(#edf3fd,#253b57);--pm-warm:light-dark(#fff7e9,#362f21);--pm-warm-ink:light-dark(#795014,#eed2a0);--pm-nav:#142638;--pm-nav-ink:#e7eff8;--pm-type:15px;--pm-gap:26px;font:var(--pm-type)/1.55 'Segoe UI',Arial,sans-serif;color:var(--pm-ink)}

@media(max-width:580px){#pa-modern .pm-shell{display:block;border-radius:8px}#pa-modern .pm-sidebar{padding:16px;gap:14px}#pa-modern .pm-brand{font-size:16px}#pa-modern .pm-brand span{display:none}#pa-modern .pm-sidebar nav{flex-direction:row;flex-wrap:wrap;gap:3px}#pa-modern .pm-sidebar button{min-height:38px;padding:9px}#pa-modern .pm-sidebar i,#pa-modern .pm-sidebar svg{display:none}#pa-modern .pm-side-footer{display:none}#pa-modern .pm-grid{grid-template-columns:minmax(0,1fr)}#pa-modern .pm-panel{padding:18px}#pa-modern h1{font-size:25px}#pa-modern .pm-main{padding:20px 16px}#pa-modern .pm-roadmap{grid-template-columns:1fr 1fr}#pa-modern .pm-telemetry strong{font-size:18px}#pa-modern .pm-table thead{display:none}#pa-modern .pm-table,#pa-modern .pm-table tbody,#pa-modern .pm-table tr,#pa-modern .pm-table td{display:block}#pa-modern .pm-table tr{border-bottom:1px solid var(--pm-line);padding:12px 0}#pa-modern .pm-table td{border:0;padding:4px 0}#pa-modern .pm-mission-toolbar .pm-met{width:100%;margin-left:0}#pa-modern .pm-camera{height:240px}}
</style>
<style>
html{color-scheme:dark}body{margin:0;background:#101820}#pa-modern{color-scheme:dark}#pa-modern .pm-shell{min-height:100vh;border:0;border-radius:0}#pa-modern .pm-sidebar{position:sticky;top:0;height:100vh;align-self:start}#pa-modern .pm-main{max-width:1240px;width:100%;margin:0 auto}#pa-modern[data-screen=observation] .pm-main{max-width:1580px}#pa-modern .pm-topbar{position:sticky;top:0;z-index:5}#pa-modern .pm-topbar button,#pa-modern .pm-topbar select{font-size:13px;min-height:34px;padding:7px 10px}#pa-modern select,#pa-modern input,#pa-modern textarea{max-width:100%;font:inherit;background:var(--pm-surface);color:var(--pm-ink);border:1px solid var(--pm-line);border-radius:6px;padding:10px}#pa-modern textarea{width:100%;min-height:100px}#pa-modern label{display:block;font-size:13px;color:var(--pm-muted);margin:14px 0 5px}#pa-modern label select,#pa-modern label input{display:block;width:100%;margin-top:6px}#pa-modern button:disabled{opacity:.45;cursor:not-allowed}#pa-modern .pm-concept{font-size:12px}#pa-modern .pm-table td{overflow-wrap:anywhere}#pa-modern .pm-issue{padding:14px 18px;background:var(--pm-warm);color:var(--pm-warm-ink);border-bottom:1px solid var(--pm-line)}#pa-modern .pm-issue p{margin:4px 0 12px;font-size:13px}#pa-modern #feedback:not(:empty){padding:12px 24px;background:var(--pm-soft);font-size:13px}#pa-modern .pm-choices{display:grid;gap:14px}#pa-modern .pm-choice{padding:16px;border:1px solid var(--pm-line);border-radius:8px;background:var(--pm-surface)}#pa-modern .pm-choice input{width:auto;margin:0 8px 0 0}#pa-modern .pm-choice p{margin:8px 0 4px;font-size:13px}#pa-modern .pm-kv{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--pm-muted)}#pa-modern .pm-schedule{margin-top:16px}#pa-modern .pm-live-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:24px}#pa-modern .pm-camera{height:380px}#pa-modern #flight-log{max-height:420px;overflow:auto;scrollbar-gutter:stable}#pa-modern .pm-live-caption{padding:14px 0;font-size:15px}#pa-modern .pm-proof{display:inline-block;padding:2px 6px;background:var(--pm-soft);color:var(--pm-accent);border-radius:4px;font-size:12px}#pa-modern .pm-footnote{font-size:12px;color:var(--pm-muted);margin-top:15px}#pa-modern .pm-tag{font-size:12px;color:var(--pm-muted)}#pa-modern .pm-end{font-size:14px;color:var(--pm-muted)}#pa-modern .pm-field{margin-bottom:14px}#pa-modern .pm-new-save{margin-top:24px;border-top:1px solid var(--pm-line);padding-top:20px}@media(max-width:900px){#pa-modern .pm-live-layout{grid-template-columns:minmax(0,1fr)}#pa-modern .pm-camera{height:300px}}@media(max-width:580px){#pa-modern .pm-sidebar{position:static;height:auto}#pa-modern .pm-topbar{position:static}#pa-modern .pm-camera{height:250px}#pa-modern #flight-log{max-height:none}}

<script>
(() => {
 const TOKEN='__CAMPAIGN_TOKEN__',root=document.getElementById('pa-modern'),main=root.querySelector('.pm-main');
 let S=null,view='overview',component='booster',context='proposal',recordId=null,location='lcc',busy=false,logIds=new Set(),lastPending='',lastSequence=0,missionId='apollo1',selectedMissions=new Set(),managerChoice='bennett',renderedFlight=null;
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>'$'+(n>=1e9?(n/1e9).toFixed(2)+'bn':(n/1e6).toFixed(n%1e6?1:0)+'m');
 const person=id=>S.staff.find(p=>p.id===id),project=id=>S.projects.find(p=>p.id===id);
 const byId=id=>S.events.find(e=>e.id===id);
 const P=id=>esc(person(id)?.name||id);
 const button=(label,action,params='',primary=false,disabled=false)=>`<button ${action.startsWith('view:')?`data-view="${action.slice(5)}"`:`data-action="${action}"`} ${params} class="${primary?'pm-primary':''}" ${disabled?'disabled':''}>${label}</button>`;
 function title(name,detail){return `<h1>${esc(name)}</h1><p class="pm-subtitle">${esc(detail)}</p>`}
 function warning(){document.getElementById('feedback').textContent=S?.error||'';const pending=S?.pending||[];const signature=pending.join();if(signature!==lastPending){lastPending=signature;const e=byId(pending[0]);document.getElementById('notice').innerHTML=e?`<div class="pm-issue"><strong>${e.kind==='escalation'?'Action required':'Observation pause'} · ${esc(e.title)}</strong><p>${esc(e.detail)} ${e.kind==='escalation'?'Existing commitments remain reserved. Acknowledge this report, then review the held dossier.':'Operational actions are already recorded. This pause gives no extra in-world emergency intervention time.'}</p>${button('Acknowledge report','acknowledge')} ${button('Open mission record','view:mission')}</div>`:'';}}
 function chrome(){root.dataset.screen=view;root.querySelectorAll('.pm-sidebar [data-screen]').forEach(b=>{if(b.dataset.screen===(view==='project'?'programme':view==='observation'?'mission':view==='architecture'?'overview':view))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.querySelector('.pm-date').textContent=S.date;root.querySelector('.pm-paused').textContent=S.running?'Running':'Paused';document.getElementById('save-name').textContent=S.save_name;document.getElementById('footer-state').textContent=S.deadline_missed?'The 1969 deadline has passed; the campaign and actual dates continue.':S.status==='complete'?'Lunar landing and return recorded.':'Development → qualification → flight';warning();let controls=root.querySelector('#live-controls');if(!controls){controls=document.createElement('span');controls.id='live-controls';root.querySelector('.pm-topbar>div').appendChild(controls)}if(Boolean(controls.querySelector('#speed'))!==Boolean(S.next_report&&S.status==='active'))controls.innerHTML=S.next_report&&S.status==='active'?`${button(S.running?'Pause':'Run',S.running?'pause':'run')} <select id="speed" aria-label="Observation speed">${[.5,1,2,4,8].map(x=>`<option value="${x}" ${S.speed===x?'selected':''}>${x===1?'Auto':x+'×'}</option>`).join('')}</select>`:'';if(S.next_report&&S.status==='active'){const speed=controls.querySelector('#speed');if(document.activeElement!==speed)speed.value=String(S.speed);root.querySelectorAll('[data-action=run],[data-action=pause]').forEach(b=>{b.dataset.action=S.running?'pause':'run';b.textContent=S.running?'Pause':'Run'})}}
 function nextDecision(){if(S.status==='complete')return ['Apollo 11 has returned.','The campaign record retains the hardware, people and decisions that led here.','Review the campaign','records'];if(S.standdown)return ['An investigation is required.','The failed attempt, obligations and personnel memories remain part of the programme.','Open recovery work','mission'];if(!S.study)return ['Set the scope of the lunar mission study.','Compare the approaches before committing to spacecraft and launch-vehicle requirements.','Review proposal','architecture'];if(S.architecture!=='lor')return ['The architecture study is ready.','Review the trade-offs and endorse the supported development programme.','Read study','architecture'];if(S.flight)return [S.mission.name+' is in progress.',S.flight.phase+'. Flight Control and the crew retain operational authority.','Observe mission','observation'];const held=S.mission_board.find(m=>m.held);if(held)return [held.name+' needs executive attention.',held.issue,'Open mission board','mission'];const missing=S.projects.find(p=>S.mission.requires.includes(p.id)&&p.status==='concept');if(missing)return ['Develop '+missing.name.toLowerCase()+'.','Design requirements and ownership will shape costs, dates, evidence and the vehicle you eventually fly.','Review development proposals','project',missing.id];const finding=S.projects.find(p=>S.mission.requires.includes(p.id)&&p.findings.length);if(finding)return ['A test finding needs attention.',finding.name+' has an observed excursion. Review the measurements and competing assessments before committing further work.','Read evidence','project',finding.id];const testing=S.projects.find(p=>S.mission.requires.includes(p.id)&&new Set(p.evidence.filter(e=>e.revision===p.revision).map(e=>e.method)).size<2);if(testing)return ['Establish current qualification evidence.',testing.name+' needs component and integrated evidence for its current revision.','Open workstream','project',testing.id];return [S.prepared?(S.clearance?'A mission decision is ready.':'Independent readiness review is due.'):'Prepare '+S.mission.name+'.',S.mission.objective,'Review mission plan','mission'];}
 function overview(){const d=nextDecision();return title('Good morning, Administrator.','Your next commitments, and the work already in your team’s hands.')+`<div class="pm-split"><section class="pm-panel pm-priority"><span class="pm-label">${S.flight?'Operations':S.status==='complete'?'Programme review':'For your attention'}</span><h2>${esc(d[0])}</h2><p>${esc(d[1])}</p><div class="pm-metadata"><span>Nora Bennett · programme coordination</span><span>${S.development_jobs} / ${S.capacity} development teams · ${S.jobs.filter(j=>j.mission).length} mission packages</span></div><div class="pm-actions"><button class="pm-primary" data-view="${d[3]}" ${d[4]?`data-component="${d[4]}"`:''}>${esc(d[2])}</button>${button('Programme context →','view:programme')}</div></section><aside class="pm-side-context"><div class="pm-eyebrow">Work in progress</div>${S.jobs.length?S.jobs.map(j=>`<div class="pm-row"><h3>${esc(j.title)}</h3><p>${esc(j.owner)} · ${j.days_left} days remaining</p><span class="pm-small">${money(j.cost)} committed · ${esc(j.account)}</span></div>`).join(''):'<p class="pm-muted">No work packages are running. Time alone will not build or qualify the programme.</p>'}<p class="pm-small">${S.next_report?'Next scheduled event: '+esc(S.next_report):'Commission work to schedule a report.'}</p></aside></div><section class="pm-later"><div class="pm-row-head"><h3>Recent reports</h3>${button('Open programme record →','view:records')}</div>${S.events.filter(e=>['report','mission_report','outcome','programme','escalation'].includes(e.kind)).slice(-3).reverse().map(e=>`<div class="pm-row"><span class="pm-small">${esc(e.date)} · ${esc(e.actor)}</span><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p></div>`).join('')||'<p class="pm-muted">Your first study and development reports will appear here.</p>'}</section><section class="pm-later"><h3>Your programme, over time</h3><div class="pm-roadmap"><div><b>Establish the approach</b>${S.architecture==='lor'?'LOR endorsed':'Studies and leadership'}</div><div><b>Develop the hardware</b>${S.projects.filter(p=>p.status==='developed').length} / 5 workstreams delivered</div><div><b>Qualify for flight</b>${S.results.length} attempts recorded</div><div><b>Reach the Moon</b>${S.mission.name} · ${esc(S.status)}</div></div></section>`;}
 function architecture(){return button('← Overview','view:overview')+title('Mission architecture','A programme commitment, with assumptions and interfaces that will persist.')+`<div class="pm-tabs">${['proposal','evidence','staff views','resources'].map(t=>`<button data-context="${t}" aria-pressed="${context===t}">${esc(t)}</button>`).join('')}</div><div class="pm-split"><section><h2>${S.study?'The comparative study is available':'Compare approaches before endorsing requirements'}</h2>${context==='staff views'?S.staff.map(p=>`<div class="pm-row"><h3>${esc(p.name)} · ${esc(p.role)}</h3><p>${esc(p.view)}</p></div>`).join(''):context==='resources'?'<dl class="pm-data-list"><div><dt>Comparative study</dt><dd>$12m · 35 days</dd></div><div><dt>Funding source</dt><dd>Engineering allocation</dd></div><div><dt>Responsible</dt><dd>Nora Bennett</dd></div></dl>':`<p>Direct ascent places a larger returning vehicle on the lunar surface. Earth-orbit rendezvous adds assembly and launch coordination. Lunar-orbit rendezvous uses a separate lander and requires reliable rendezvous at lunar distance.</p><p>A comparison does not qualify hardware. The launch vehicle, crew spacecraft, lander, ground systems and operations still need development and evidence.</p><div class="pm-note">This expanded prototype supports the historical LOR end-to-end campaign. Direct ascent and Earth-orbit rendezvous are study alternatives; their full vehicle branches are not implemented.</div>`}<div class="pm-actions">${!S.study?button('Commission study · $12m','study','',true,S.jobs.some(j=>j.kind==='study')):S.architecture!=='lor'?button('Endorse LOR development programme','endorse','',true):'<span class="pm-proof">LOR programme endorsed</span>'}</div></section><aside class="pm-panel"><h3>Why it matters later</h3><p class="pm-muted">Your design, staffing, testing and concurrency decisions will affect mass allowance, calendar time, revision work and the configuration at launch.</p><p class="pm-small">You inherit Saturn IB capability, Mercury experience and research. The new lunar hardware is yours to develop.</p></aside></div>`;}
 function programme(){return title('Lunar programme','Design, ownership and evidence stay attached to each workstream.')+`<section class="pm-panel"><div class="pm-row-head"><h2>${S.architecture==='lor'?'LOR programme development':'Architecture not yet endorsed'}</h2>${button('Architecture file','view:architecture')}</div><p class="pm-muted">Two aggregate teams initially; one active package per lead. Funding another team expands concurrency, but does not create another specialist.</p><div class="pm-actions">${button(S.capacity===3?'Three teams available':'Expand to three teams · $250m / 180 days','capacity','',false,S.capacity===3||S.jobs.some(j=>j.kind==='capacity'))}</div></section><table class="pm-table"><thead><tr><th>Workstream</th><th>Configuration</th><th>Owner</th><th>Evidence</th><th></th></tr></thead><tbody>${S.projects.map(p=>`<tr><td>${esc(p.name)}<small>${esc(p.status)}</small></td><td>${esc(p.design||'Requirements pending')} · rev ${p.revision}</td><td>${P(p.lead)}</td><td>${p.findings.length?'Finding to review':new Set(p.evidence.filter(e=>e.revision===p.revision).map(e=>e.method)).size+' / 2 current test types'}</td><td><button data-view="project" data-component="${p.id}">Open</button></td></tr>`).join('')}</tbody></table><section class="pm-later"><h3>Mission portfolio</h3>${button('Open delegated mission board','view:mission')}${S.mission_board.map((m,i)=>`<div class="pm-row"><div class="pm-row-head"><span>${esc(m.name)} · ${esc(m.vehicle)}</span><span class="pm-small">${esc(m.status)}</span></div><p>${esc(m.objective)}</p><span class="pm-small">Historical reference: ${m.reference}; actual dates follow your programme.</span></div>`).join('')}</section>`;}
 function projectView(){const p=project(component);const active=S.jobs.find(j=>j.component===p.id);return `<button data-view="programme" class="pm-quiet pm-back">← Programme</button>`+title(p.name,p.description)+`<div class="pm-tabs">${['proposal','evidence','staff views','resources'].map(t=>`<button data-context="${t}" aria-pressed="${context===t}">${esc(t)}</button>`).join('')}</div><div class="pm-split"><section>${active?`<div class="pm-note">${esc(active.title)} · ${active.days_left} days remaining. ${esc(active.owner)} remains responsible.</div>`:''}${context==='evidence'?evidence(p):context==='staff views'?p.assessments.map(a=>`<div class="pm-row"><h3>${esc(a.person)}</h3><p>${esc(a.text)}</p></div>`).join(''):context==='resources'?`<dl class="pm-data-list"><div><dt>Engineering available</dt><dd>${money(S.funds.engineering.available)}</dd></div><div><dt>Readiness available</dt><dd>${money(S.funds.readiness.available)}</dd></div><div><dt>Current dry-mass assumption</dt><dd>${p.mass?p.mass+' t':'Not applicable'}</dd></div><div><dt>Current payload allowance</dt><dd>${p.capacity?p.capacity+' t':'Set at the vehicle level'}</dd></div></dl><p class="pm-footnote">Mass/performance values are simplified prototype assumptions, not historical flight specifications.</p>`:`<h2>${p.status==='concept'?'Development proposals':'Configuration revision proposals'}</h2><p class="pm-muted">${p.status==='concept'?'Approve a requirements proposal and its work package. Delivery does not itself qualify the hardware.':'A design change is paid rework. It invalidates current readiness and requires current-revision testing; flown snapshots are unchanged.'}</p><div class="pm-choices">${p.designs.map(d=>`<div class="pm-choice"><h3>${esc(d.name)}${p.design===d.id?' · current':''}</h3><p>${esc(d.tradeoff)}</p><div class="pm-kv"><span>${money(p.status==='concept'?d.cost:Math.floor(d.cost*.4))} · engineering</span><span>${p.status==='concept'?d.estimated_days:Math.ceil(d.estimated_days*.4)} days estimated</span>${d.mass?`<span>${d.mass} t dry mass</span>`:''}${d.capacity?`<span>${d.capacity} t payload allowance</span>`:''}</div><div class="pm-actions">${button(p.status==='concept'?'Authorise development':'Authorise design revision','design',`data-component="${p.id}" data-design="${d.id}"`,false,!!active||p.design===d.id)}</div></div>`).join('')}</div>`}</section><aside class="pm-panel"><h3>Responsible lead</h3><form id="assignment"><input type="hidden" name="component" value="${p.id}"><label>Workstream owner<select name="lead">${S.staff.filter(x=>x.id!=='ortiz').map(x=>`<option value="${x.id}" ${p.lead===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><button type="submit" ${active?'disabled':''}>Record assignment</button></form><div class="pm-later"><h3>Qualification work</h3>${Object.entries(p.tests).map(([method,t])=>`<div class="pm-row"><h3>${esc(t.name)}</h3><p>${money(t.cost)} · ${t.estimated_days} days · readiness</p>${button('Commission test','test',`data-component="${p.id}" data-method="${method}"`,false,!!active||p.status!=='developed')}</div>`).join('')}<div class="pm-row"><h3>Focused inspection and rework</h3><p>${money(p.rework.cost)} · ${p.rework.days} days · engineering. Changes the configuration; fresh tests are needed.</p>${button('Authorise corrective revision','rework',`data-component="${p.id}"`,false,!!active||p.status!=='developed')}</div></div></aside></div>`;}
 function evidence(p){return `<h2>Evidence and configuration</h2><p class="pm-muted">Measured indices are not failure probabilities. Older revisions remain recorded and do not qualify the current configuration.</p>${p.evidence.slice().reverse().map(e=>`<div class="pm-row"><span class="pm-proof">Revision ${e.revision}${e.revision===p.revision?' · current':' · archived'}</span><h3>${esc(p.tests[e.method].name)}</h3><p>${esc(e.date)} · ${esc(e.source)}</p><p>${Object.entries(e.observations).map(([k,v])=>esc(k)+' index '+v.toFixed(3)).join(' · ')}</p><p>${esc(e.caveat)}</p><button data-record="${e.event}" class="pm-quiet">Open linked report →</button></div>`).join('')||'<p>No tests recorded. Development or commissioning a test is not evidence of its result.</p>'}`;}
 function people(){return title('People and responsibilities','A persistent team, with work you can trace rather than a friendship score.')+`<div class="pm-grid">${S.staff.map(p=>`<section class="pm-panel"><div class="pm-person"><span class="pm-avatar">${esc(p.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div>${esc(p.name)}<small>${esc(p.role)}</small></div></div><p>${esc(p.view)}</p><div class="pm-row"><h3>Current responsibilities</h3><p>${S.projects.filter(h=>h.lead===p.id).map(h=>esc(h.name)).join(' · ')||'Independent mission readiness and investigation'}${S.mission_board.filter(m=>m.authority&&m.manager===p.id&&m.status!=='Completed').map(m=>' · '+esc(m.name)+' coordination').join('')}</p></div><div class="pm-row"><h3>Shared work history</h3><p>${p.work.map(k=>esc(project(k).name)).join(' · ')||'No completed campaign work yet.'}</p>${p.memories.slice(-3).reverse().map(id=>`<button class="pm-quiet" data-record="${id}">${esc(byId(id)?.title||id)} →</button>`).join('<br>')}</div></section>`).join('')}</div>`;}
 function funding(){return title('Programme funding','Authorised work keeps its allocation when the discretionary reserve is exhausted.')+`<div class="pm-note">Finite prototype campaign R&amp;D authority; these are not NASA’s historical total appropriations. Work-package prices include their contracted labour. There are no automatic annual top-ups or free additional funds.</div><div class="pm-grid">${Object.entries(S.funds).map(([k,f])=>`<section class="pm-panel"><div class="pm-eyebrow">${esc(k)}</div><dl class="pm-data-list"><div><dt>Allocation</dt><dd>${money(f.allocation)}</dd></div><div><dt>Committed</dt><dd>${money(f.committed)}</dd></div><div><dt>Paid</dt><dd>${money(f.paid)}</dd></div><div><dt>Available</dt><dd>${money(f.available)}</dd></div></dl></section>`).join('')}</div><section class="pm-panel pm-later"><h3>Release uncommitted reserve</h3><p class="pm-muted">An explicit release within this campaign authority. It cannot undo an obligation, cross appropriations or create funding.</p><form id="reserve"><div class="pm-grid"><label>Destination<select name="account"><option>engineering</option><option>readiness</option><option>operations</option></select></label><label>Amount in millions<input name="millions" type="number" min="1" step="1" value="100" required></label></div><label>Rationale<input name="rationale" required maxlength="1000" placeholder="What work or scope does this support?"></label><button type="submit">Record reserve release</button></form></section><section class="pm-later"><h3>Transaction ledger</h3>${S.ledger.slice(-30).reverse().map(t=>`<div class="pm-row"><div class="pm-row-head"><span>${esc(t.operation)} · ${money(t.amount)} · ${esc(t.account)}</span><span class="pm-small">${esc(t.date)}</span></div><p>${esc(t.purpose)}</p><span class="pm-small">Account available afterward: ${money(t.available)}</span></div>`).join('')||'<p>No expenditure yet.</p>'}</section>`;}
 function records(){const selected=recordId?byId(recordId):null;return title('Programme record','Decisions, evidence, people and outcomes stay connected.')+`${selected?`<section class="pm-panel pm-priority"><div class="pm-eyebrow">${esc(selected.kind)} · ${esc(selected.date)}</div><h2>${esc(selected.title)}</h2><p>${esc(selected.detail)}</p><p class="pm-small">${esc(selected.actor)}</p><div class="pm-actions">${selected.links.map(id=>`<button data-record="${esc(id)}">${esc(byId(id)?.title||id)}</button>`).join('')}</div></section>`:''}<section class="pm-panel pm-later"><h3>Your current interpretation</h3><form id="theory"><textarea name="text" maxlength="2000" required>${esc(S.theory)}</textarea><p class="pm-small">Your interpretation does not alter the underlying mechanism or the evidence.</p><button type="submit">Record interpretation</button></form></section><section class="pm-later"><h3>Mission attempts</h3>${S.results.map(r=>`<div class="pm-row"><div class="pm-row-head"><h3>${esc(r.name)} · ${esc(r.outcome.replaceAll('_',' '))}</h3><span class="pm-small">${esc(r.date)}</span></div><p>${Object.entries(r.designs).map(([k,v])=>esc(project(k).name)+': '+esc(v)+' / rev '+r.configuration[k]).join(' · ')}</p><button data-record="${r.event}" class="pm-quiet">Open outcome and causal links →</button></div>`).join('')||'<p class="pm-muted">No attempts yet.</p>'}</section><section class="pm-later"><h3>Chronological history</h3>${S.events.slice().reverse().map(e=>`<div class="pm-row"><span class="pm-small">${esc(e.date)} · ${esc(e.actor)} · ${esc(e.kind)}</span><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p>${e.links.length?`<button data-record="${e.id}" class="pm-quiet">Follow ${e.links.length} linked record(s) →</button>`:''}</div>`).join('')}</section>`;}
 function mission(){const chosen=S.mission_board.find(m=>m.id===missionId)||S.mission_board[0];return title('Mission portfolio','Approve several missions together. Teams prepare them concurrently; flight gates and shared operations capacity remain in force.')+`<section class="pm-panel"><div class="pm-row-head"><h2>Delegated campaign</h2>${S.flight?button('Observe '+esc(S.mission.name),'view:observation','',true):''}</div><p class="pm-muted">${S.jobs.filter(j=>j.kind==='prepare').length} / ${S.preparation_teams} mission preparation teams · one independent assurance team · one shared flight/test operations slot. Programme managers coordinate these teams; their engineering work remains separately staffed.</p>${S.standdown?`<div class="pm-issue"><h3>Accident standdown</h3><p>Investigate before another attempt. The affected hardware and prepared missions may need correction and funded amendments.</p>${button('Commission investigation · $80m / 90 days','investigation','',false,S.jobs.some(j=>j.kind==='investigation'))}</div>`:''}<form id="mandates"><div class="pm-board-scroll"><table class="pm-table"><thead><tr><th>Select</th><th>Mission / scope</th><th>Team status</th><th>Funding / manager</th><th></th></tr></thead><tbody>${S.mission_board.map(m=>`<tr><td><input aria-label="Select ${esc(m.name)}" type="checkbox" name="missions" value="${m.id}" ${selectedMissions.has(m.id)?'checked':''} ${m.authority||m.status==='Completed'||m.job||m.status==='In operations'?'disabled':''}></td><td>${esc(m.name)}<small>${esc(m.vehicle)} · ${m.ground?'occupied ground test':m.crew?'crewed':'uncrewed'}</small></td><td>${esc(m.status)}${m.job?`<small>Report due ${esc(new Date(Date.parse('1961-05-25T08:00:00Z')+m.job.due*1000).toISOString().slice(0,10))}</small>`:''}</td><td>${m.authority?money(Object.values(m.obligations).reduce((a,b)=>a+b,0))+' committed<small>'+P(m.manager)+'</small>':money(Object.values(m.quote).reduce((a,b)=>a+b,0))+' proposed'}</td><td><button type="button" data-mission="${m.id}">Dossier</button></td></tr>`).join('')}</tbody></table></div><label>Delegated programme manager<select name="manager" id="mandate-manager">${S.staff.filter(p=>p.id!=='ortiz').map(p=>`<option value="${p.id}" ${p.id===managerChoice?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><p id="mandate-total" class="pm-footnote"></p><button type="submit" ${S.architecture!=='lor'||S.status==='complete'?'disabled':''}>Authorise selected missions</button></form><p class="pm-footnote">The envelope funds preparation, independent review and execution once. Scope stays fixed; no automatic top-ups or unsafe launch authority. Preparation can precede flight evidence. Run time or use Next report to let teams proceed.</p></section>${missionDossier(chosen)}`;}
 function missionDossier(m){return `<section class="pm-panel pm-later"><div class="pm-row-head"><h2>${esc(m.name)} · dossier</h2><span>${esc(m.status)}</span></div><p>${esc(m.objective)}</p><p class="pm-muted">Historical reference: ${esc(m.reference)}; actual dates follow this programme. ${m.ground?'This is an occupied ground test, not a launch.':`Estimated payload ${m.mass.payload} t / allowance ${m.mass.capacity} t / margin ${m.mass.margin} t.`}</p><div class="pm-split"><section><h3>Preparation and flight gates</h3><p>${m.prepare_days} days of preparation · 14 days of independent review. Evidence gates may extend the calendar.</p><p>Flight evidence dependencies: ${m.dependencies.map(id=>esc(S.mission_board.find(x=>x.id===id).name)).join(', ')||'No earlier mission result required; hardware evidence still applies.'}</p>${m.blocks.length?'<ul>'+m.blocks.map(b=>'<li>'+esc(b)+'</li>').join(''):'<p>Recorded gates are satisfied; the team still retains safety authority.</p>'}${m.issue?'<div class="pm-issue">'+esc(m.issue)+'</div>':''}<p>${m.authority?'Remaining commitments: preparation '+money(m.obligations.prepare)+', review '+money(m.obligations.review)+', execution '+money(m.obligations.execute)+'.':'Proposed envelope: preparation '+money(m.quote.prepare)+' operations, review '+money(m.quote.review)+' readiness, execution '+money(m.quote.execute)+' operations.'}</p>${m.held?`<p>Additional commitment if amended: ${money(m.quote.prepare+m.quote.execute)} operations + ${money(m.quote.review)} readiness. Retained commitments are not charged again.</p>${button('Approve amendment and resume delegation','amend_mission',`data-mission-id="${m.id}"`,true,!!m.job||S.standdown||S.pending.length>0)}`:m.authority&&m.status!=='Completed'&&m.status!=='In operations'?button('Defer this mission','defer_mission',`data-mission-id="${m.id}"`):''}${m.authority?`<p><button class="pm-quiet" data-record="${m.authority}">Read delegated authority →</button></p>`:''}</section><aside><h3>Configuration and responsible people</h3>${m.requires.map(k=>{const p=project(k);return `<div class="pm-row"><strong>${esc(p.name)}</strong><p>${P(p.lead)} · rev ${p.revision} · ${esc(p.design||'not delivered')}</p><button data-view="project" data-component="${k}" class="pm-quiet">Open configuration →</button></div>`}).join('')}</aside></div></section>`;}
 function updateQuote(){const q=S.mission_board.filter(m=>selectedMissions.has(m.id));const op=q.reduce((v,m)=>v+m.quote.prepare+m.quote.execute,0),review=q.reduce((v,m)=>v+m.quote.review,0);const el=main.querySelector('#mandate-total');if(el)el.textContent=`${q.length} selected · ${money(op)} operations + ${money(review)} readiness. Available: ${money(S.funds.operations.available)} operations / ${money(S.funds.readiness.available)} readiness.`;}
 function liveMission(){return title(S.mission.name+' · mission observation',S.mission.vehicle+' · '+S.mission.objective)+`<div class="pm-mission-toolbar"><div id="locations">${[['lcc','Launch Control'],['mcc','Mission Control'],['recovery','Recovery']].map(([key,name])=>`<button data-location="${key}" aria-pressed="${location===key}">${name}</button>`).join('')}</div><span class="pm-met" id="met"></span></div><div class="pm-live-layout"><section><div class="pm-camera" id="camera"><span class="pm-camera-label" id="camera-label"></span><svg viewBox="0 0 520 340" aria-label="Schematic vehicle illustration, driven by the mission model"><g id="rocket"><path d="M-10 0V-130L-5-145V-165L0-180L5-165V-145L10-130V0Z" fill="#eef2f3"/><path d="M-10-30H10V-45H-10ZM-10-85H10V-100H-10Z" fill="#233743"/><path id="flame" d="M-7 0L0 40L7 0" fill="#efb36c"/></g><g id="orbit" style="display:none"><circle cx="250" cy="170" r="70" fill="#456e85" stroke="#b6d7df"/><ellipse cx="250" cy="170" rx="170" ry="60" transform="rotate(-18 250 170)" fill="none" stroke="#e1edf8"/><circle cx="394" cy="116" r="5" fill="#fff1c5"/></g><text id="ground-test" x="260" y="170" text-anchor="middle" fill="#eef3f8" font-size="20"></text></svg><span class="pm-camera-foot" id="camera-foot"></span></div><div class="pm-telemetry"><div><span>Altitude · nominal estimate</span><strong id="altitude">—</strong></div><div><span>Speed · nominal estimate</span><strong id="velocity">—</strong></div><div><span>Operational phase</span><strong id="phase" style="font-size:16px">—</strong></div></div><div class="pm-live-caption" id="commentary"></div><details><summary>Your flown configuration and team</summary>${S.flight.hardware.map(h=>`<div class="pm-row"><h3>${esc(h.name)} · rev ${h.revision}</h3><p>${P(h.lead)} · ${esc(h.design)}</p>${h.lineage.slice(-2).map(id=>`<button data-record="${id}" class="pm-quiet">${esc(byId(id)?.title||id)} →</button>`).join('<br>')}</div>`).join('')}</details></section><aside><div class="pm-row-head"><h3>Mission transcript</h3>${button(S.running?'Pause':'Run',S.running?'pause':'run')}</div><div id="flight-log" aria-label="Mission transcript"></div><section class="pm-panel pm-later"><h3>Flight Director</h3><p class="pm-muted">Operational and crew safety actions do not await executive permission.</p><div class="pm-choices">${button('What is observed?','brief','data-question="observations"')}${button('What remains uncertain?','brief','data-question="uncertainty"')}${button('What requires my authority?','brief','data-question="authority"')}</div><div id="briefing-answer" aria-live="polite"></div></section></aside></div>`;}
 function settings(){return title('Save & settings','Your existing 1969 scenario saves remain separate.')+`<section class="pm-panel"><h3>Current campaign</h3><p>${esc(S.save_name)} · seed ${S.seed} · version ${esc(S.version_label||'development')}</p><p class="pm-muted">Commands and reports save automatically. A running mission also checkpoints during observation.</p>${button('Save now','save','',true)} ${button('Save and quit','shutdown')}<div class="pm-new-save"><h3>Fresh campaign</h3><p>A fresh campaign starts on 25 May 1961 in a new save file. This run is saved first.</p><form id="fresh"><label>Deterministic seed<input name="seed" type="number" min="0" max="4294967295" value="${S.seed}" required></label><button type="submit">Start a fresh save</button></form></div><div class="pm-new-save"><h3>Resume a campaign</h3><form id="load"><label>Saved 1961 campaigns<select name="name">${S.saves.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><button type="submit">Load selected save</button></form></div></section><div class="pm-note">This campaign uses an approximate engineering model, fixed-price work packages and finite no-year R&amp;D authority. Full congressional funding, detailed contractors and alternative-architecture flight campaigns are deferred.</div>`;}
 function render(){if(!S)return;if(view==='observation'&&!S.flight)view='mission';chrome();main.innerHTML=({overview,architecture,programme,project:projectView,people,funding,records,mission,observation:liveMission,settings}[view]||overview)();if(view==='observation'&&S.flight){renderedFlight=S.flight.cause;logIds=new Set();updateFlight()}if(view==='mission')updateQuote();lastSequence=S.events.length;}
 function updateFlight(){if(!S.flight||!main.querySelector('#met')||renderedFlight!==S.flight.cause){if(view==='observation')render();return}const f=S.flight;const t=Math.abs(f.met),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;main.querySelector('#met').textContent=`T${f.met<0?'−':'+'}${String(h).padStart(3,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;main.querySelector('#phase').textContent=f.phase;main.querySelector('#altitude').textContent=f.estimate?.altitude_km!=null?f.estimate.altitude_km.toFixed(1)+' km':'—';main.querySelector('#velocity').textContent=f.estimate?.speed_km_s!=null?f.estimate.speed_km_s.toFixed(2)+' km/s':'—';main.querySelector('#camera-label').textContent=S.mission.ground?'Ground-test observation':location==='mcc'?'Mission Control / schematic':location==='recovery'?'Recovery / awaiting return report':S.mission.vehicle+' / schematic tracking view';main.querySelector('#camera-foot').textContent=f.contingency?'Contingency response in effect. Follow controller reports.':S.mission.ground?'No launch is taking place. Ground hazards and emergency authority remain active.':S.mission.vehicle==='Saturn V'?'Nominal trajectory estimate and schematic illustration; not measured physical telemetry.':'Saturn IB schematic. Detailed trajectory telemetry is not modelled.';const insertion=S.events.some(e=>e.time>=f.start&&e.kind==='launch'&&e.title.toLowerCase().includes('orbit insertion'));const orbital=insertion;const positionAvailable=!!f.estimate?.latitude||f.estimate?.latitude===0;main.querySelector('#rocket').style.display=!S.mission.ground&&!orbital&&!f.contingency&&location!=='recovery'?'':'none';main.querySelector('#orbit').style.display=!S.mission.ground&&orbital&&!f.contingency&&location!=='recovery'&&(positionAvailable||S.mission.vehicle==='Saturn IB')?'':'none';main.querySelector('#ground-test').textContent=f.contingency?'CONTINGENCY IN EFFECT':S.mission.ground?f.phase:location==='recovery'?'AWAITING RETURN':orbital&&!positionAvailable&&S.mission.vehicle==='Saturn V'?f.phase:'';main.querySelector('#rocket').setAttribute('transform',`translate(${f.met<15?245:275} ${f.met<15?290-Math.max(0,f.met)*3:235}) rotate(${Math.min(65,Math.max(0,f.met)*.08)})`);main.querySelector('#flame').style.display=f.met>=-8&&f.met<699?'':'none';const entries=S.events.filter(e=>e.time>=f.start&&e.mission===S.mission.id&&['launch','continuity','operations','interruption','phase','mission','briefing'].includes(e.kind));const latest=entries.at(-1);main.querySelector('#commentary').textContent=latest?latest.actor+' / '+latest.detail:'';const log=main.querySelector('#flight-log');const follow=log.scrollHeight-log.scrollTop-log.clientHeight<30;const oldTop=log.scrollTop;for(const e of entries){if(logIds.has(e.id))continue;const row=document.createElement('div');row.className='pm-log';const elapsed=e.time-f.start;row.innerHTML=`<time>+${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}</time><div><b>${esc(e.actor)}</b>${esc(e.title)}. ${esc(e.detail)}</div>`;log.appendChild(row);logIds.add(e.id)}if(follow)log.scrollTop=log.scrollHeight;else log.scrollTop=oldTop;}
 async function api(action,params={},paint=true){if(busy)return false;busy=true;try{const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','X-Per-Aspera':TOKEN},body:JSON.stringify({action,...params})});const data=await response.json();if(data.campaign)S=data;if(data.stopped){chrome();document.getElementById('feedback').textContent='Saved. The local game has closed; you can close this tab.';return true}if(!response.ok){document.getElementById('feedback').textContent=data.error||'The command could not be completed.';chrome();return false}if(paint)render();else{chrome();if(view==='observation')updateFlight();else if(['mission','overview'].includes(view)&&S.events.length!==lastSequence&&S.events.slice(lastSequence).some(e=>['report','mission_report','mission_work','mandate','outcome','programme','escalation'].includes(e.kind))){const top=window.scrollY;render();window.scrollTo(0,top)}}return true}catch(error){document.getElementById('feedback').textContent='Connection interrupted. Your last acknowledged save remains on disk. '+error.message;return false}finally{busy=false}}
 root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!S)return;if(b.dataset.mission){missionId=b.dataset.mission;const top=window.scrollY;render();window.scrollTo(0,top);return}if(b.dataset.screen||b.dataset.view){view=b.dataset.screen||b.dataset.view;if(b.dataset.component)component=b.dataset.component;context='proposal';render();if(view==='observation'&&S.flight)await api('location',{location},false);return}if(b.dataset.context){context=b.dataset.context;render();return}if(b.dataset.record){recordId=b.dataset.record;view='records';render();return}if(b.dataset.location){location=b.dataset.location;await api('location',{location},false);root.querySelectorAll('[data-location]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.location===location)));return}let action=b.dataset.action;if(!action)return;if(action==='settings'){view='settings';render();return}if(action==='brief'){await api('brief',{question:b.dataset.question},false);const reply=S.events.filter(e=>e.kind==='briefing').at(-1);main.querySelector('#briefing-answer').textContent=reply?.detail||S.error||'';return}let params={};if(['amend_mission','defer_mission'].includes(action))params.mission=b.dataset.missionId;if(['study','capacity','investigation','prepare','review'].includes(action)){params.kind=action;action='commission'}if(action==='design'){const p=project(b.dataset.component);params={kind:p.status==='concept'?'develop':'redesign',component:p.id,design:b.dataset.design};action='commission'}if(action==='test'){params={kind:b.dataset.method,component:b.dataset.component};action='commission'}if(action==='rework'){params={kind:'rework',component:b.dataset.component};action='commission'}if(action==='launch'){view='observation';location='lcc'}await api(action,params,!['pause','run','acknowledge'].includes(action))});
 root.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;const fields=Object.fromEntries(new FormData(form));if(form.id==='mandates'){if(await api('authorise_missions',{missions:[...selectedMissions],manager:fields.manager})){selectedMissions.clear();render()}}if(form.id==='assignment')await api('assign',fields);if(form.id==='reserve')await api('reserve',{account:fields.account,amount:Number(fields.millions)*1e6,rationale:fields.rationale});if(form.id==='theory')await api('theory',{text:fields.text});if(form.id==='fresh'){if(!confirm('Save this run and start a separate campaign from May 1961?'))return;view='overview';await api('fresh',{seed:Number(fields.seed)})}if(form.id==='load'){view='overview';await api('load',fields)}});
 root.addEventListener('change',async e=>{if(e.target.name==='missions'){if(e.target.checked)selectedMissions.add(e.target.value);else selectedMissions.delete(e.target.value);updateQuote()}if(e.target.id==='mandate-manager')managerChoice=e.target.value;if(e.target.id==='speed')await api('speed',{value:Number(e.target.value)},false)});
 async function poll(){if(S?.running)await api('tick',{},false);setTimeout(poll,250)}
 fetch('/api/state').then(r=>r.json()).then(data=>{S=data;location=S.location;render();poll()}).catch(error=>{main.textContent='Unable to load the local campaign: '+error.message});
})();
</script>
